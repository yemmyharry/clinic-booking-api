services:
  - type: web
    name: clinic-booking-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-booking-db
          property: connectionString

databases:
  - name: clinic-booking-db
    plan: free
