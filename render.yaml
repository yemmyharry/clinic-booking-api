services:
  - type: web
    name: clinic-booking-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: API_KEY
        generateValue: true
      # Render's private Postgres connection uses a self-signed TLS certificate.
      - key: DATABASE_SSL
        value: require
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-booking-db
          property: connectionString

databases:
  - name: clinic-booking-db
    plan: free
    region: frankfurt
    postgresMajorVersion: '17'
