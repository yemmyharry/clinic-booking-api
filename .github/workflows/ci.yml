name: Verify booking API
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://clinic:test-password@localhost:5432/postgres
      - name: Verify production imports without development dependencies
        run: |
          npm prune --omit=dev
          NODE_ENV=production DATABASE_URL=postgresql://clinic:test-password@localhost:5432/postgres node --input-type=module -e "import('./dist/db/index.js').then(async m => { await m.getPool().query('SELECT 1'); await m.closePool(); })"
